<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recognify Consent</title>
<style>
  /* Same black-and-white look as the app (lib/app/theme.dart):
     light = off-white page, white rounded card, near-black buttons;
     dark (phone in dark mode) = black page, dark grey card, white buttons. */
  :root {
    color-scheme: light dark;
    --page: #EEF0F4;
    --card: #FFFFFF;
    --soft: #F7F8FA;
    --text: #0A0A0B;
    --muted: #5F6670;
    --line: #D3D7DD;
    --primary: #0F172A;
    --on-primary: #FFFFFF;
    --ok: #166534;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #060606;
      --card: #151515;
      --soft: #1D1D1F;
      --text: #FFFFFF;
      --muted: #A1A1AA;
      --line: #383838;
      --primary: #F5F5F5;
      --on-primary: #060606;
      --ok: #4ADE80;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Tahoma, "Noto Naskh Arabic", sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 32px;
    line-height: 1.6;
    color: var(--text);
    background: var(--page);
  }
  #consent {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 24px 20px;
  }
  h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.2px; }
  p, li { color: var(--text); }
  ul { padding-inline-start: 20px; }
  li { margin: 4px 0; }
  .lang {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .lang button {
    font-size: 15px;
    padding: 8px 18px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .lang button[aria-pressed="true"] {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
  }
  .never-stored {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 16px;
    margin: 20px 0;
    color: var(--muted);
  }
  button {
    font-size: 18px;
    font-weight: 600;
    padding: 14px 28px;
    border: 1px solid transparent;
    border-radius: 24px;
    cursor: pointer;
    font-family: inherit;
    min-height: 48px;
  }
  button:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
  #askActions button, #agreeBtn { width: 100%; }
  #agreeBtn { background: var(--primary); color: var(--on-primary); }
  #saveBtn {
    width: 100%;
    background: var(--card);
    color: var(--text);
    border-color: var(--line);
    margin-top: 16px;
  }
  #done { display: none; }
  .code {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 6px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    margin: 16px 0;
    direction: ltr;
  }
  .checkmark { font-size: 20px; font-weight: 600; color: var(--ok); }
  hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
  .version { color: var(--muted); font-size: 11px; margin-top: 24px; text-align: center; }
  /* Paper / PDF: always black on white, no buttons. */
  @media print {
    :root {
      --page: #FFFFFF; --card: #FFFFFF; --soft: #FFFFFF; --text: #000000;
      --muted: #333333; --line: #999999; --ok: #000000;
    }
    body { padding: 0; }
    #consent { border: none; padding: 0; }
    .lang, #askActions, #saveBtn { display: none !important; }
  }
</style>
</head>
<body>

<!--
  English / Arabic consent page. The fixed wording for BOTH languages
  lives here (copied word for word from lib/app/strings.dart, keys
  consent_page_*); the app only sends the person's details, the code
  and the starting language. That keeps the QR code short, and the
  other person can switch language with the buttons at the top.
  If you change the wording in strings.dart, change it here too.

  The terms appear ONCE; after "I Agree" the confirmation is added
  under them, so saving / printing captures everything a single time.
  The small "v4" line at the bottom shows the live page is up to date.
-->

<div class="lang" role="group" aria-label="Language / اللغة">
  <button id="btnEn" type="button" onclick="setLang('en')">English</button>
  <button id="btnAr" type="button" onclick="setLang('ar')">العربية</button>
</div>

<!--
  ONE block only: the request text appears once. "I Agree" is replaced
  by the confirmation underneath it, so the page and a saved / printed
  copy never show the request twice.
-->
<div id="consent">
  <h2 data-t="title"></h2>
  <p><b class="user"></b> <span data-t="intro"></span></p>
  <ul>
    <li><span data-t="name_label"></span>: <b class="person"></b></li>
    <li data-t="embedding_text"></li>
    <li class="relLine" style="display:none"><span data-t="relationship_label"></span>: <span class="rel"></span></li>
  </ul>
  <div class="never-stored"><span data-t="never_stored"></span></div>

  <div id="askActions">
    <button id="agreeBtn" type="button" data-t="agree_button"></button>
  </div>

  <div id="done">
    <hr>
    <p class="checkmark">&#10003; <span data-t="agreed_on"></span> <span id="dateNow"></span></p>
    <p data-t="code_label"></p>
    <div class="code" id="codeValue"></div>
    <p><span data-t="show_code"></span> <b class="user"></b></p>
    <button id="saveBtn" type="button" onclick="window.print()" data-t="save_button"></button>
  </div>
</div>

<p class="version">Recognify consent page v4</p>

<script>
  const TEXT = {
  "en": {
    "title": "Consent Request",
    "intro": "uses the Recognify app to help remember people. They're asking your consent to save:",
    "name_label": "Your name",
    "embedding_text": "Face embeddings (sets of numbers derived from a short scan of your face from a few angles, not photos). The app may add more only when its user confirms it recognised you correctly.",
    "relationship_label": "Relationship",
    "never_stored": "Your actual photo is never stored — only this derived data, kept only on their device.",
    "agree_button": "I Agree",
    "agreed_on": "You agreed on",
    "code_label": "Your confirmation code:",
    "show_code": "Show this code to",
    "save_button": "Save / Print This Page"
  },
  "ar": {
    "title": "طلب موافقة",
    "intro": "يستخدم تطبيق ريكوجنيفاي لمساعدته على تذكر الأشخاص. يطلب موافقتك لحفظ:",
    "name_label": "اسمك",
    "embedding_text": "بصمات وجه (مجموعات أرقام مستخلصة من مسح قصير لوجهك من عدة زوايا، وليست صوراً). قد يضيف التطبيق المزيد فقط عندما يؤكد مستخدمه أنه تعرّف عليك بشكل صحيح.",
    "relationship_label": "العلاقة",
    "never_stored": "صورتك الفعلية لا تُحفظ أبداً — فقط هذه البيانات المستخلصة، وتبقى فقط على جهازه.",
    "agree_button": "أوافق",
    "agreed_on": "وافقت في",
    "code_label": "رمز التأكيد الخاص بك:",
    "show_code": "أظهر هذا الرمز لـ",
    "save_button": "حفظ / طباعة هذه الصفحة"
  }
};

  const p = new URLSearchParams(window.location.search);
  const get = (key) => p.get(key) || '';
  let agreedAt = null;

  // The person's details (typed in the app) are shown as they are.
  document.querySelectorAll('.user').forEach(el => el.textContent = get('user'));
  document.querySelectorAll('.person').forEach(el => el.textContent = get('name'));
  const rel = get('relationship');
  if (rel) {
    document.querySelectorAll('.rel').forEach(el => el.textContent = rel);
    document.querySelectorAll('.relLine').forEach(el => el.style.display = 'list-item');
  }
  document.getElementById('codeValue').textContent = get('code');

  function setLang(lang) {
    if (!TEXT[lang]) lang = 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(el => {
      el.textContent = TEXT[lang][el.dataset.t] || '';
    });
    document.getElementById('btnEn').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('btnAr').setAttribute('aria-pressed', lang === 'ar');
    if (agreedAt) {
      document.getElementById('dateNow').textContent =
        agreedAt.toLocaleString(lang === 'ar' ? 'ar-AE' : 'en-GB');
    }
  }

  document.getElementById('agreeBtn').addEventListener('click', () => {
    agreedAt = new Date();
    document.getElementById('askActions').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    setLang(document.documentElement.lang);
  });

  // Starts in the app's language; the buttons switch it any time.
  setLang(get('lang') === 'ar' ? 'ar' : 'en');
</script>

</body>
</html>
