<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recognify Consent</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Tahoma, "Noto Naskh Arabic", sans-serif;
    max-width: 520px;
    margin: 24px auto;
    padding: 0 20px;
    line-height: 1.6;
    color: #1a1a2e;
  }
  h2 { margin-bottom: 4px; }
  ul { padding-inline-start: 20px; }
  .lang {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .lang button {
    font-size: 16px;
    padding: 8px 16px;
    background: #f0f0f0;
    color: #1a1a2e;
  }
  .lang button[aria-pressed="true"] {
    background: #1a1a2e;
    color: #fff;
  }
  .never-stored {
    background: #f0f0ff;
    border-radius: 12px;
    padding: 14px 16px;
    margin: 20px 0;
  }
  button {
    font-size: 18px;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  #agreeBtn { background: #4C4CE0; color: #fff; }
  #saveBtn { background: #f0f0f0; color: #1a1a2e; margin-top: 20px; }
  #done { display: none; }
  .code {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 6px;
    background: #f0f0ff;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin: 16px 0;
    direction: ltr;
  }
  .checkmark { font-size: 22px; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 24px 0; }
  @media print { .lang, #agreeBtn, #saveBtn { display: none !important; } }
</style>
</head>
<body>

<!--
  English / Arabic consent page. The fixed wording for BOTH languages
  lives here (copied word for word from lib/app/strings.dart, keys
  consent_page_*); the app only sends the person's details, the code
  and the starting language. That keeps the QR code short, and the
  other person can switch language with the buttons at the top.
  If you change the wording in strings.dart, change it here too.

  Deliberately ONE block for the confirmation: the terms are repeated
  inside it, so saving / printing always captures everything,
  whatever the scroll position (some mobile browsers only printed the
  part on screen).
-->

<div class="lang" role="group" aria-label="Language / اللغة">
  <button id="btnEn" type="button" onclick="setLang('en')">English</button>
  <button id="btnAr" type="button" onclick="setLang('ar')">العربية</button>
</div>

<div id="ask">
  <h2 data-t="title"></h2>
  <p><b class="user"></b> <span data-t="intro"></span></p>
  <ul>
    <li><span data-t="name_label"></span>: <b class="person"></b></li>
    <li data-t="embedding_text"></li>
    <li class="relLine" style="display:none"><span data-t="relationship_label"></span>: <span class="rel"></span></li>
  </ul>
  <div class="never-stored"><span data-t="never_stored"></span></div>
  <button id="agreeBtn" type="button" data-t="agree_button"></button>
</div>

<div id="done">
  <h2 data-t="title"></h2>
  <p><b class="user"></b> <span data-t="intro"></span></p>
  <ul>
    <li><span data-t="name_label"></span>: <b class="person"></b></li>
    <li data-t="embedding_text"></li>
    <li class="relLine" style="display:none"><span data-t="relationship_label"></span>: <span class="rel"></span></li>
  </ul>
  <div class="never-stored"><span data-t="never_stored"></span></div>
  <hr>
  <p class="checkmark">&#10003; <span data-t="agreed_on"></span> <span id="dateNow"></span></p>
  <p data-t="code_label"></p>
  <div class="code" id="codeValue"></div>
  <p><span data-t="show_code"></span> <b class="user"></b></p>
  <button id="saveBtn" type="button" onclick="window.print()" data-t="save_button"></button>
</div>

<script>
  const TEXT = {
  "en": {
    "title": "Consent Request",
    "intro": "uses the Recognify app to help remember people. They're asking your consent to save:",
    "name_label": "Your name",
    "embedding_text": "A face embedding (a set of numbers derived from your face, not a photo)",
    "relationship_label": "Relationship",
    "never_stored": "Your actual photo is never stored — only this derived data, kept only on their device.",
    "agree_button": "I Agree",
    "agreed_on": "You agreed on",
    "code_label": "Your confirmation code:",
    "show_code": "Show this code to",
    "save_button": "Save / Print This Page"
  },
  "ar": {
    "title": "طلب موافقة",
    "intro": "يستخدم تطبيق ريكوجنيفاي لمساعدته على تذكر الأشخاص. يطلب موافقتك لحفظ:",
    "name_label": "اسمك",
    "embedding_text": "بصمة وجه (مجموعة أرقام مستخلصة من وجهك، وليست صورة)",
    "relationship_label": "العلاقة",
    "never_stored": "صورتك الفعلية لا تُحفظ أبداً — فقط هذه البيانات المستخلصة، وتبقى فقط على جهازه.",
    "agree_button": "أوافق",
    "agreed_on": "وافقت في",
    "code_label": "رمز التأكيد الخاص بك:",
    "show_code": "أظهر هذا الرمز لـ",
    "save_button": "حفظ / طباعة هذه الصفحة"
  }
};

  const p = new URLSearchParams(window.location.search);
  const get = (key) => p.get(key) || '';
  let agreedAt = null;

  // The person's details (typed in the app) are shown as they are.
  document.querySelectorAll('.user').forEach(el => el.textContent = get('user'));
  document.querySelectorAll('.person').forEach(el => el.textContent = get('name'));
  const rel = get('relationship');
  if (rel) {
    document.querySelectorAll('.rel').forEach(el => el.textContent = rel);
    document.querySelectorAll('.relLine').forEach(el => el.style.display = 'list-item');
  }
  document.getElementById('codeValue').textContent = get('code');

  function setLang(lang) {
    if (!TEXT[lang]) lang = 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(el => {
      el.textContent = TEXT[lang][el.dataset.t] || '';
    });
    document.getElementById('btnEn').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('btnAr').setAttribute('aria-pressed', lang === 'ar');
    if (agreedAt) {
      document.getElementById('dateNow').textContent =
        agreedAt.toLocaleString(lang === 'ar' ? 'ar-AE' : 'en-GB');
    }
  }

  document.getElementById('agreeBtn').addEventListener('click', (e) => {
    e.target.disabled = true;
    e.target.style.opacity = '0.5';
    agreedAt = new Date();
    document.getElementById('done').style.display = 'block';
    setLang(document.documentElement.lang);
  });

  // Starts in the app's language; the buttons switch it any time.
  setLang(get('lang') === 'ar' ? 'ar' : 'en');
</script>

</body>
</html>
